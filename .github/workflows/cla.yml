# Asks a first-time outside contributor to accept CLA.md by commenting on their pull request, and records who
# has in signatures/cla.json on the cla-signatures branch. The branch rules require the job `cla`.
#
# This is the one workflow here on pull_request_target, which the action needs so it can comment and set a
# status on a pull request from a fork. That is safe only because it never checks out or runs the pull
# request's code. Do not add a checkout step to it.
name: cla

on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  cla:
    name: cla
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Check, or record, the signature
        if: >-
          github.event_name == 'pull_request_target'
          || github.event.comment.body == 'recheck'
          || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          path-to-document: https://github.com/resourcepack-ai/mcgui/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # The copyright holders, and the bots that only move versions.
          allowlist: joshdevous,stephendotgg,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
