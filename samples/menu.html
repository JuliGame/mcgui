<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Server menu</title>
<style>
  :root { --gold: #fbbf24; --panel: rgba(15, 23, 42, 0.72); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: "Inter", system-ui, sans-serif; color: #f8fafc;
    background: radial-gradient(circle at 20% 20%, #4f46e5 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, #db2777 0%, transparent 40%), #0b1020;
    display: flex; align-items: center; justify-content: center;
  }
  .panel {
    width: 760px; padding: 36px 40px; border-radius: 24px; background: var(--panel);
    border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(16px);
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
  }
  h1 { margin: 0 0 6px; font-size: 40px; font-weight: 800; letter-spacing: -0.02em;
       background: linear-gradient(90deg, #fde68a, #f59e0b); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin: 0 0 28px; color: #94a3b8; font-size: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .tile { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 14px; color: inherit; text-decoration: none;
          background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); cursor: pointer; }
  .tile:hover { background: rgba(255,255,255,.14); border-color: var(--gold); transform: translateY(-2px); }
  .icon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: #1e293b; color: var(--gold); flex: none; }
  .tile b { display: block; font-size: 15px; }
  .tile small { color: #94a3b8; font-size: 12px; }
  .bar { margin-top: 26px; display: flex; justify-content: space-between; align-items: center; }
  .online { font-size: 13px; color: #a7f3d0; }
  .online::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #34d399; margin-right: 8px; box-shadow: 0 0 12px #34d399; }
  .btn { padding: 10px 22px; border-radius: 999px; background: var(--gold); color: #1c1917; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
  <div class="panel">
    <h1>Welcome back, {player}</h1>
    <p class="sub">Pick a world. Your inventory travels with you.</p>
    <div class="grid">
      <a class="tile" data-command="server survival">
        <div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 3 7v10l9 5 9-5V7z"/></svg></div>
        <div><b>Survival</b><small>120 playing</small></div>
      </a>
      <a class="tile" data-command="server skyblock">
        <div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/></svg></div>
        <div><b>Skyblock</b><small>87 playing</small></div>
      </a>
      <a class="tile" data-command="server minigames">
        <div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
        <div><b>Minigames</b><small>203 playing</small></div>
      </a>
      <a class="tile" href="shop.html">
        <div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-2 9H8zM6 6 5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg></div>
        <div><b>Shop</b><small>Ranks, crates, cosmetics</small></div>
      </a>
      <a class="tile" href="rules.html">
        <div class="icon">§</div>
        <div><b>Rules</b><small>Read before you play</small></div>
      </a>
      <a class="tile" data-action="close">
        <div class="icon">✕</div>
        <div><b>Close</b><small>Back to the lobby</small></div>
      </a>
    </div>
    <div class="bar"><span class="online">410 players online</span><a class="btn" href="#">Vote for us</a></div>
  </div>
</body>
</html>
