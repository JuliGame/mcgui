<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC GUI - Radial Hexagonal Menu</title>
<meta name="ui:size" content="16x9">
<meta name="ui:height" content="576">
<meta name="ui:overlay" content="rgba(0, 0, 0, 0)">
<style>
:root{
  --hex-w:130px; --hex-h:150px;
  --ox:calc(var(--hex-w)*.5); --oy:calc(var(--hex-h)*.75); --fx:var(--hex-w);
  --hexclip:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
}
*{box-sizing:border-box}
body,html{
  margin:0;padding:0;width:100vw;height:100vh;
  background:transparent!important;
  font-family:'Minecraft','Inter',sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;user-select:none;
}
.radial-menu{position:relative;width:0;height:0}

/* ---------- Hexagon: outer = border, inner = face ---------- */
.hex{
  position:absolute;left:calc(var(--hex-w)/-2);top:calc(var(--hex-h)/-2);
  width:var(--hex-w);height:var(--hex-h);
  background:rgba(200,200,200,.28);
  clip-path:var(--hexclip);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transform:translate(var(--x,0),var(--y,0)) scale(var(--s,1));
  transition:transform .12s steps(4),background .1s;
}
.hex:hover{background:var(--accent,#fff);--s:1.07;z-index:5}
.hex:active{--s:.96}

.hex-inner{
  position:relative;
  width:calc(100% - 8px);height:calc(100% - 9.2px);
  background:linear-gradient(180deg,rgba(58,58,58,.88),rgba(24,24,24,.92));
  clip-path:var(--hexclip);
  pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  animation:pop .35s steps(5) both;
  animation-delay:var(--d,0s);
}
/* accent tint + top bevel highlight */
.hex-inner::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 40%,var(--accent,#fff) 0%,transparent 70%);
  opacity:0;transition:opacity .12s;
}
.hex:hover .hex-inner::before{opacity:.30}
.hex-inner::after{
  content:"";position:absolute;left:0;right:0;top:0;height:30%;
  background:linear-gradient(180deg,rgba(255,255,255,.10),transparent);
}
.hex-inner svg{
  position:relative;z-index:1;width:64px;height:64px;
  filter:drop-shadow(3px 3px 0 rgba(0,0,0,.55));
  transition:transform .12s steps(3);
}
.hex:hover .hex-inner svg{transform:scale(1.12);animation:bob .5s steps(1) infinite}

.center-inner{background:radial-gradient(circle,rgba(0,0,0,.55),rgba(0,0,0,.85))}
.center-inner::after{display:none}

@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes bob{0%{translate:0 0}50%{translate:0 -3px}}

/* ---------- Positions + accents (Minecraft color-code palette) ---------- */
.pos-center      {--x:0;--y:0;cursor:default;--d:0s}
.pos-center:hover{background:rgba(200,200,200,.28);--s:1}
.pos-top-left    {--x:calc(-1*var(--ox));--y:calc(-1*var(--oy));--accent:#55ff55;--d:.05s}
.pos-top-right   {--x:var(--ox);--y:calc(-1*var(--oy));--accent:#ff5555;--d:.10s}
.pos-right       {--x:var(--fx);--y:0;--accent:#ffaa00;--d:.15s}
.pos-bottom-right{--x:var(--ox);--y:var(--oy);--accent:#55ffff;--d:.20s}
.pos-bottom-left {--x:calc(-1*var(--ox));--y:var(--oy);--accent:#ff55ff;--d:.25s}
.pos-left        {--x:calc(-1*var(--fx));--y:0;--accent:#ffff55;--d:.30s}

/* ---------- Center text (pure CSS sibling hover, no JS) ---------- */
.center-label{
  position:absolute;left:0;top:0;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  white-space:nowrap;z-index:10;pointer-events:none;
  text-shadow:2px 2px 0 rgba(0,0,0,.85);
}
.center-label b{font-weight:normal;font-size:20px;letter-spacing:1px;text-transform:capitalize}
.center-label small{font-size:11px;color:#a8a8a8}
.default-label b{color:#fff}
.hover-label{display:none}
.hover-label b{color:var(--c)}
.lbl-overworld{--c:#55ff55}.lbl-home{--c:#ff5555}.lbl-ah{--c:#ffaa00}
.lbl-order{--c:#55ffff}.lbl-shop{--c:#ff55ff}.lbl-map{--c:#ffff55}

.pos-top-left:hover ~ .lbl-overworld,
.pos-top-right:hover ~ .lbl-home,
.pos-right:hover ~ .lbl-ah,
.pos-bottom-right:hover ~ .lbl-order,
.pos-bottom-left:hover ~ .lbl-shop,
.pos-left:hover ~ .lbl-map{display:flex}

.pos-top-left:hover ~ .default-label,
.pos-top-right:hover ~ .default-label,
.pos-right:hover ~ .default-label,
.pos-bottom-right:hover ~ .default-label,
.pos-bottom-left:hover ~ .default-label,
.pos-left:hover ~ .default-label{display:none}
</style>
</head>
