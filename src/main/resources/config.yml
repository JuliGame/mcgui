# MC GUI: HTML pages in game, on walls of maps and in fullscreen views. Pages live in
# plugins/MCGUI/<pages-folder>/.

pages-folder: pages

# /gui as well as /mcgui. Turn it off when another plugin uses /gui (read when the server starts).
gui-alias: true

# /ui as well (the command's name before MC GUI). Turn it off when another plugin uses /ui.
ui-alias: true

# How MC GUI's messages look in chat: [MCGUI] in front, as the other ResourcePack AI
# plugins do. Colours are #rrggbb, with or without the hash; anything that is not
# one falls back to its default.
chat:
  # The word inside the brackets, in front of everything this plugin says.
  prefix: "MCGUI"
  colour:
    # The word in the brackets, and the brackets around it.
    prefix: "#3670f8"
    brackets: "#555555"
    # Ordinary text: the rest of every line.
    body: "#aaaaaa"
    # What a sentence is about: a page, a code. Also the headings in /mcgui's help.
    accent: "#3670f8"
    # A command named in a message (click it to put it in the chat box).
    command: "#ffffff"
    # Something went wrong, something worked, and something worth a second look.
    error: "#ff5555"
    success: "#55ff55"
    warning: "#ffff55"

# Edit a page (or its CSS or images) and it updates in game within a second.
live-reload: true

# Where /mcgui import <code> fetches pages shared from mcgui.dev (the browser builder for these pages),
# with the code put on the end. Blank turns /mcgui import off.
import-url: https://mcgui.dev/api/builder/ui/page/

# Usage count: every 30 seconds MC GUI sends a random id, how many players are online and the names
# of plugins that depend on it. And when somebody runs /mcgui import, the request to mcgui.dev also says
# this server's port, its server-ip (if set), its MOTD, how many players are on and who ran the command,
# so we can see where pages made there are used. Off, neither is sent and /mcgui import still works.
telemetry: true

# Tells the console on start, and ops (mcgui.update) as they join, when a newer MC GUI is on SpigotMC.
# It asks api.spigotmc.org for the current version number and sends nothing else.
update-check: true

# Pages made on mcgui.dev say so (a generator meta tag), and are drawn with a faint mark that mcgui.dev can
# read back from a screenshot to tell that a page came from it: some blocks of plain colour are a shade
# bluer than they would be. Nothing about the player or the server is in it. Off, pages are drawn exactly.
builder-mark: true

# Let pages load stylesheets, fonts and images from the web (Google Fonts, image hosts). They are
# fetched once and kept in plugins/MCGUI/cache/. Each fetch may take 15 seconds and 16 MB at most.
allow-web: true

# Let pages load from this machine and private networks too (localhost, 10.x, 192.168.x, a cloud's
# metadata address). Off, so that a page, or a stylesheet it pulls in from the web, cannot make the
# server fetch from inside your network. Turn it on only to serve a page's files from a local web server.
allow-private-hosts: false

# Drawing happens off the server thread, on the shared pool of CPU threads (`cpu-threads`, below,
# default: the cores minus one), the same threads that encode the pictures for the maps. There is no
# separate number of render threads: one budget keeps the game's own thread from waiting for a core.

# Seconds of CPU time one picture of a page may take to draw (time on a busy server's clock doesn't
# count, up to 5 times this). A page that takes longer is given up and reported like one that cannot
# be drawn (the screen goes back to the page it showed), so that it cannot hold a render thread for
# good. 0 for no limit.
render-timeout: 2

# Seconds a screen's picture is kept whole once nothing is drawn on it and its pointer is still. Then it is put
# away in pieces shared with every other screen showing the same pixels there (other players on the same page),
# so idle views hold well under a megabyte each instead of about 9 MB. The next hover or scroll puts it back first
# (a few milliseconds). 0 keeps every picture whole.
park-pictures-after: 5

# The sound of a click on a link or button that does something: true for the game's own button click,
# false for none, or any sound as "<sound> [volume] [pitch]" (e.g. "block.note_block.hat 0.5 1.6", or one
# of your own, "uiengine:<file>" for plugins/MCGUI/sounds/<file>.ogg). A page can set its own with <meta name="ui:click-sound">.
click-sound: true

# Pictures a second of a page while something on it animates (CSS animation or transition), 1 to 20. Each
# is a whole picture of the page, drawn for each player watching it, and only the parts that changed are
# sent: an animation costs CPU for as long as it runs, so a page that animates for ever costs it for ever.
animation-fps: 10

# How far one notch of the scroll wheel scrolls a page, in CSS pixels, or "tile" for one map row (64 CSS
# pixels on a 16x9 view 576 pixels tall). A page can set its own with <meta name="ui:scroll-step">.
# With "tile", every notch moves the picture by whole maps, and players are sent only the row that came
# in: their frames are pointed at the maps they already have (about an eighth of the bytes of a notch).
scroll-step: 80

# Whether a scroll by whole map rows is sent as frames pointed at maps players already have (on), or as
# every changed map sent again (off). Only for comparing the two.
tile-shift: true

# While a player's pointer rests on a page (or heads for something) and the cpu-threads pool has
# nothing else to do, the hover pictures of up to this many targets are drawn in advance, the likeliest first (where
# the pointer's next move most probably lands), so a hover that lands on one shows without waiting for it to be
# drawn. Real pictures always come first: drawing ahead stops the moment any player needs one. A hover that changes
# no pixel takes no turn. 0 turns it off. Applies to screens opened after a reload.
hover-ahead: 4

# The most CPU that drawing ahead may use, every player's together, in cores on average (it may spend up to half
# a second at once). Drawing ahead is a guess, and the cores it burns are the ones chunk loading and other
# plugins use. 0 turns drawing ahead off for everyone; 1 is the most it can use (one drawing at a time).
hover-ahead-cpu: 0.5

# Hover pictures are kept and shared by every player in the same state on the same page, so a hover one player
# drew (or that was drawn ahead for them) is not drawn again for the next. This much memory at most.
hover-repaints:
  megabytes: 64

# The first picture of each page at each screen size, kept so that the next player to open that page there
# is sent the picture at once instead of waiting for it to be drawn (and a private wall sends each map
# once, not blank first). Drawn for every placed screen when the plugin starts. Least recently used go first;
# 0 megabytes keeps none.
first-pictures:
  entries: 64
  megabytes: 128

sharing:
  # A page filled in with a player's own values ({player}, {x}, PlaceholderAPI) is still drawn once for
  # everybody where it does not show their values: a player's first picture is another's with only their own
  # values drawn in, and a hover is shared between players whose pictures are laid out alike where neither
  # shows their values near it. Every player sees, to the pixel, what their own page draws, and their clicks
  # run their own commands. Off: each player's page is drawn for them alone.
  personal-pages: true

views:
  # Size of a fullscreen page, in maps (128 pixels each). A page can set its own with
  # <meta name="ui:size" content="12x7">.
  size: 16x9
  # The page is laid out as if the view were this many CSS pixels tall (16x9 maps at 576 makes a
  # 1024 x 576 page drawn at twice the sharpness). A page can set its own with <meta name="ui:height">.
  height: 576
  # A view is fitted to the player's field of view. Minecraft does not tell the server what a player's
  # FOV setting is, so this is assumed until they set theirs with /mcgui fov.
  default-fov: 70
  # How far the pointer moves for each step the mouse reports (a "count"), whatever the player's mouse
  # sensitivity, which MC GUI reads from how their head turns. 1.0 is a desktop pointer at Windows'
  # default speed on a 1920-pixel-wide screen: the view, which fills the window, is 1920 counts across
  # (6 cm with an 800 DPI mouse), so the pointer moves as the player's own desktop pointer does. 1.5 is
  # 1280 counts (4 cm at 800 DPI). Players scale it for themselves with /mcgui pointer.
  pointer-speed: 1.0
  # With the pack, the player's own client draws the pointer every frame from where they look, so it has
  # no network or tick lag. Off: the server moves the pointer as their rotation arrives (20 times a second).
  client-pointer: true
  # With a client-drawn pointer: the most hidden maps each view may use for hovers its client shows by itself, the
  # frame the pointer gets there, without waiting for the server (hover layers). The hovers drawn ahead near the
  # pointer are sent in advance, each on a map for every 128x126 part of what it changes; a hover that needs more
  # than half of them (one that changes a large panel) is left to the server. Each map in use costs the player's
  # client about 10 us a frame and the server more CPU per picture. 32 is a good start. 0: off.
  hover-layers: 0
  # Log where each click on a client-drawn pointer lands, and every correction, as [pointer] lines. For testing.
  debug-pointer: false
  # Shown in front of a player at a view whose shaders replace the game's own (Iris with a shader pack on), which
  # cannot draw MC GUI's pages: nobody else ever sees it. Plain text. Empty: none.
  shaders-notice: "This menu can't be shown while shaders are on. Turn them off (Iris: press K; OptiFine: Video Settings, Shaders, OFF), then open it again."
  # What the server takes off a player's screen while they have a page open, so that it is gone whichever resource
  # pack's shaders are in use. The pack hides the HUD on its own when MC GUI's shaders are the ones the client uses; a pack
  # that replaces them (Dialog Engine's drawn dialogs merged into another plugin's pack, for one) leaves the sidebar, boss bars
  # and action bar showing over the page. This is done with packets in the player's own connection and for them alone: the
  # client is told to drop each one when the page opens, what the server sends meanwhile is kept and not passed on, and when the
  # page closes (any way) they get what the server last sent, as it is by then. It does not use the scoreboard API, so it works
  # with any plugin that draws them (TAB, boss bar plugins, anything sending packets). MC GUI's own messages still show. Read
  # when the server starts. Each is on by default: with MC GUI's shaders in use the player sees no difference, and where they are
  # not it is the fix; turn one off if you want a plugin's scoreboard, bar or action bar to stay on screen at pages.
  # A plugin that opens a view through the API can choose its own set (ViewOptions.hud); this is what a view gets when it does not.
  hide-hud:
    scoreboard: true
    boss-bars: true
    action-bar: true

walls:
  # A wall screen's page is laid out this many CSS pixels per map tall, unless the page says
  # otherwise with <meta name="ui:height">.
  pixels-per-map: 128
  # Whether the scroll wheel scrolls a wall screen you are looking at (it then does not change your
  # hotbar slot while you look at one).
  scroll-wheel: true
  # Right-clicking a wall screen opens the page it is on fullscreen; sneak to get back up. Off, a
  # right click clicks the page like a left click does.
  right-click-fullscreen: true

# The resource pack, the screens and the threads below are read when the server starts: /mcgui reload
# does not change them.
resource-pack:
  # upload: the default. MC GUI uploads its pack to ResourcePack AI's pack host (packs.resourcepack.ai),
  #   free, and players download it from there: nothing to open or set up, on any host. It is only
  #   uploaded again when it changes, it is kept while this server uses it (one nothing has used for 30
  #   days is deleted), and only the Minecraft client can download it. If the upload fails, MC GUI
  #   serves the pack itself on port and public-url below until it works, and the console says so.
  # serve: MC GUI serves its pack itself on port, and players are sent public-url. Needs that port open
  #   and public-url set to an address players can reach.
  # external: MC GUI serves nothing. Host plugins/MCGUI/pack.zip yourself and set public-url, which
  #   players are sent on join; or merge it into another plugin's pack and leave public-url blank, and
  #   a player who loads that pack counts as having MC GUI's. The pack is also unpacked into
  #   plugins/MCGUI/pack/ for plugins that merge folders. ItemsAdder: add MCGUI/pack under
  #   resource-pack.zip.merge_other_plugins_resourcepacks_folders, then /iazip. CraftEngine: add it under
  #   resource-pack.merge-external-folders. BetterHud: under merge-other-folders. Oraxen: copy pack.zip into
  #   Oraxen/pack/uploads/. Nexo: into Nexo/pack/external_packs/. RP Engine: copy the folder to
  #   RPEngine/content/mcgui. Merge again after every MC GUI update; the console says if a merge is wrong.
  # off: no pack. Walls show dithered vanilla map colours, and no page opens fullscreen: views need the pack.
  mode: upload
  # serve (or upload when it fails): where the built-in server listens. It only ever serves /pack.zip.
  bind: 0.0.0.0
  port: 25602
  # serve and external: the URL players download the pack from. Blank (serve) means
  # http://127.0.0.1:<port>/pack.zip, which only works for a player on the same machine.
  public-url: ""
  required: false
  prompt: "This server's screens need a small resource pack for full colour."
  # Another plugin that draws through Minecraft's text shader (BetterHud, HUDEngine, ItemsAdder's text
  # effects, Oraxen's animated glyphs) replaces the same shader file MC GUI's pages are drawn with, and a
  # game keeps only one copy. With this on, MC GUI reads that plugin's pack at startup and merges its text
  # shader into its own, so both work. A plugin that only writes its pack after MC GUI starts (a pack
  # plugin) is merged within a minute of writing it and players online are sent the pack again (serve
  # and upload; with external, on the next restart). The console says what was merged.
  merge-shaders: true

screens:
  # Map data sent to each player, in bytes per second as it goes over the network, compressed. One map pixel
  # is one byte before compression and only changed areas are sent, so a static page costs its size once;
  # a game moving the whole of a 16x9 view 30 times a second needs about 1 to 4 MB a second.
  max-bytes-per-second-per-player: 8000000
  # Players further than this many blocks from a wall screen get no updates for it.
  view-distance: 48
  # How far away a player can point at and click a wall screen, in blocks.
  reach: 8
  # Compress each map picture once, on its own thread, and write the same bytes to everyone
  # watching it, instead of every player's connection compressing its own copy on the network threads.
  # A connection whose packets another plugin reads or rewrites on their way out (ViaVersion, ProtocolLib,
  # PacketEvents) still gets packets as before, so that plugin sees them; the log says so once.
  shared-compression: true

# Threads for everything that burns CPU off the server thread: drawing pages (and the pictures of any plugin
# built on this one), converting pictures to map colours and encoding them. All of it shares this one pool,
# so it can never have more threads running than this, however many players are using screens. The
# server thread needs a core of its own: with more threads here than cores minus one, it waits for a
# core like any other thread and ticks late. 0 means the cores minus one (at least 1). Raise it only on
# a machine with cores to spare, for faster pictures when many players change them at once; a higher
# number than the cores is a bad idea. Read at start (changing it needs a restart).
cpu-threads: 0

# Map ids MC GUI owns. They never get saved-map files, so they cannot collide with real maps as
# long as the world has fewer maps than this.
map-id-base: 2000000000

debug: false
