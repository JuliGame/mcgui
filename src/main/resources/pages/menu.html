<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Menu</title>
<!--
  Your first MC GUI page. Edit it and it updates in game.
  Open it with /mcgui open menu, or put it on a wall with /mcgui place menu 4 3.

  In game:
    <a href="rules.html">           goes to another page in this folder (back: the F key, or a back link)
    data-command="spawn"            runs a command as the player ({player} and friends are filled in)
    data-console="give {player} bread 1"   runs a command as the console
    data-action="close"             closes the page; also "back", "reload", "top"
    :hover and cursor: pointer      work, with the pointer turning into a hand
-->
<style>
  :root { --gold: #fbbf24; --panel: rgba(15, 23, 42, 0.72); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: Inter, system-ui, sans-serif; color: #f8fafc;
    background: radial-gradient(circle at 20% 20%, #4f46e5 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, #db2777 0%, transparent 40%), #0b1020;
    display: flex; align-items: center; justify-content: center;
  }
  .panel {
    width: 760px; padding: 36px 40px; border-radius: 24px; background: var(--panel);
    border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(16px);
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
  }
  h1 { margin: 0 0 6px; font-size: 40px; font-weight: 800; letter-spacing: -0.02em;
       background: linear-gradient(90deg, #fde68a, #f59e0b); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin: 0 0 28px; color: #94a3b8; font-size: 16px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .tile { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 14px; color: inherit; text-decoration: none;
          background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); cursor: pointer; }
  .tile:hover { background: rgba(255,255,255,.14); border-color: var(--gold); }
  .icon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: #1e293b; color: var(--gold); flex: none; font-weight: 700; }
  .tile b { display: block; font-size: 15px; }
  .tile small { color: #94a3b8; font-size: 12px; }
  .bar { margin-top: 26px; display: flex; justify-content: space-between; align-items: center; }
  .online { font-size: 13px; color: #a7f3d0; }
  .online::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #34d399; margin-right: 8px; box-shadow: 0 0 12px #34d399; }
  .btn { padding: 10px 22px; border-radius: 999px; background: var(--gold); color: #1c1917; font-weight: 700; text-decoration: none; cursor: pointer; }
  .btn:hover { background: #fde68a; }
</style>
</head>
<body>
  <div class="panel">
    <h1>Welcome, {player}</h1>
    <p class="sub">This page is plugins/MCGUI/pages/menu.html. Change it and watch.</p>
    <div class="grid">
      <a class="tile" href="rules.html">
        <div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h12l4 4v12H4z"/><path d="M8 12h8M8 16h5"/></svg></div>
        <div><b>Rules</b><small>Another page</small></div>
      </a>
      <a class="tile" href="shop.html">
        <div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-2 9H8zM6 6 5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg></div>
        <div><b>Shop</b><small>Cards and hover</small></div>
      </a>
      <a class="tile" data-command="help">
        <div class="icon">/</div>
        <div><b>/help</b><small>Runs a command</small></div>
      </a>
      <a class="tile" data-message="<gold>Hello from an HTML page, {player}!">
        <div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H8l-4 4z"/></svg></div>
        <div><b>Say hi</b><small>A chat message</small></div>
      </a>
      <a class="tile" href="https://resourcepack.ai">
        <div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></div>
        <div><b>Website</b><small>Sent to chat</small></div>
      </a>
      <a class="tile" data-action="close">
        <div class="icon">&#10005;</div>
        <div><b>Close</b><small>Or sneak</small></div>
      </a>
    </div>
    <div class="bar"><span class="online">{online} online</span><a class="btn" href="shop.html">Open the shop</a></div>
  </div>
</body>
</html>
