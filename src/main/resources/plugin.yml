name: UIFramework
version: ${version}
main: ai.resourcepack.uiframework.UIFrameworkPlugin
api-version: '1.21'
description: Full-colour pictures on walls of maps and in fullscreen views you drive with your mouse, for vanilla clients.
website: https://resourcepack.ai
commands:
  uiframework:
    aliases: [uif]
    description: Test screens, set your field of view, re-send the pack.
    usage: /uif test wall|view [cols] [rows] | fov <degrees> | pack | stats | clear
permissions:
  uiframework.admin:
    description: Use /uif test, stats and clear.
    default: op
