name: ScreenEngine
version: ${version}
main: ai.resourcepack.screens.ScreenEnginePlugin
api-version: '1.21'
description: Full-colour pictures on walls of maps and in fullscreen views you drive with your mouse, for vanilla clients.
website: https://resourcepack.ai
commands:
  screens:
    description: Test screens, set your field of view, re-send the pack.
    usage: /screens test wall|view [cols] [rows] | fov <degrees> | pack | stats | clear
permissions:
  screenengine.admin:
    description: Use /screens test, stats and clear.
    default: op
