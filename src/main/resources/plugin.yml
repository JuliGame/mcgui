name: UIEngine
version: ${version}
main: ai.resourcepack.ui.UIEnginePlugin
api-version: '1.21'
softdepend: [PlaceholderAPI]
description: HTML pages in game, on walls of maps and fullscreen, for vanilla clients; and a framework for other plugins to draw on them.
website: https://resourcepack.ai
commands:
  ui:
    description: Open, place and reload HTML pages; test screens, set your field of view and pointer speed, re-send the pack.
    usage: /ui open <page> [player] | close | place <page> [cols] [rows] [name] [shared] | remove [name] | list | reload | test wall|view [cols] [rows] | fov <degrees> | pointer [speed] | pack | stats | clear
permissions:
  # One node per subcommand, checked as uiengine.<subcommand>, and a separate
  # .others node for pointing one at somebody else. uiengine.admin is only a
  # parent: nothing checks it, it grants all of them in one line. Closing your
  # OWN page needs nothing, as sneaking out of it needs nothing.
  uiengine.admin:
    description: Everything below. A convenience parent, not a node anything checks.
    default: op
    children:
      uiengine.open: true
      uiengine.open.others: true
      uiengine.close.others: true
      uiengine.place: true
      uiengine.remove: true
      uiengine.list: true
      uiengine.reload: true
      uiengine.test: true
      uiengine.test.others: true
      uiengine.stats: true
      uiengine.clear: true
      uiengine.debug: true
      uiengine.debug.others: true
      uiengine.fov: true
      uiengine.pointer: true
      uiengine.pack: true
  uiengine.open:
    description: Open a page fullscreen for yourself with /ui open.
    default: op
  uiengine.open.others:
    description: Open a page for another player with /ui open <page> <player>, and close it again.
    default: op
    children:
      uiengine.close.others: true
  uiengine.close.others:
    description: Close another player's page with /ui close <player>.
    default: op
  uiengine.place:
    description: Put a page on a wall with /ui place.
    default: op
  uiengine.remove:
    description: Take a wall screen down with /ui remove.
    default: op
  uiengine.list:
    description: List the pages and every placed screen, with where it is, with /ui list.
    default: op
  uiengine.reload:
    description: Read the config and every page again with /ui reload.
    default: op
  uiengine.test:
    description: Put a test picture on a wall or open one as a view, with /ui test.
    default: op
  uiengine.test.others:
    description: Open a test view or place a test wall for another player, with /ui test ... <player>.
    default: op
  uiengine.stats:
    description: See how many walls there are and how much map data has been sent, with /ui stats.
    default: op
  uiengine.clear:
    description: Remove every test wall, whoever placed it, with /ui clear.
    default: op
  uiengine.debug:
    description: Drive your own open view with /ui debug (point, click, scroll, speed, close), for testing.
    default: op
  uiengine.debug.others:
    description: Drive another player's open view with /ui debug <player>.
    default: op
  uiengine.fov:
    description: Fit views to your field of view with /ui fov.
    default: true
  uiengine.pointer:
    description: Set how fast the pointer moves in your views with /ui pointer.
    default: true
  uiengine.pack:
    description: Have the resource pack sent to you again with /ui pack.
    default: true
