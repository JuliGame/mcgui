<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MC GUI - Radial Hexagonal Menu</title>
<meta name="ui:size" content="8x7">
<meta name="ui:height" content="448">
<meta name="ui:overlay" content="rgba(0, 0, 0, 0)">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;font-family:'Minecraft','Inter',sans-serif;overflow:hidden}
.radial-menu{position:absolute;left:50%;top:50%;width:0;height:0}

/* Hexagons are drawn as SVG polygons (clip-path is not supported by MC GUI) */
.hex{position:absolute;width:130px;height:150px;cursor:pointer}
.hex svg{display:block;width:130px;height:150px}
.edge{fill:#c8c8c8;fill-opacity:.3}
.face{fill:#1e1e1e;fill-opacity:.9}
.center .face{fill:#000;fill-opacity:.8}

.pos-center{left:-65px;top:-75px;cursor:default}
.pos-top-left{left:-130px;top:-187.5px}
.pos-top-right{left:0;top:-187.5px}
.pos-right{left:65px;top:-75px}
.pos-bottom-right{left:0;top:37.5px}
.pos-bottom-left{left:-130px;top:37.5px}
.pos-left{left:-195px;top:-75px}

/* Hover: border lights up in each button's accent color */
.pos-top-left:hover .edge{fill:#55ff55;fill-opacity:1}
.pos-top-right:hover .edge{fill:#ff5555;fill-opacity:1}
.pos-right:hover .edge{fill:#ffaa00;fill-opacity:1}
.pos-bottom-right:hover .edge{fill:#55ffff;fill-opacity:1}
.pos-bottom-left:hover .edge{fill:#ff55ff;fill-opacity:1}
.pos-left:hover .edge{fill:#ffff55;fill-opacity:1}

/* Center text, pure CSS sibling hover */
.center-label{position:absolute;left:-75px;top:-22px;width:150px;text-align:center;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.85);pointer-events:none}
.center-label b{display:block;font-weight:normal;font-size:20px;letter-spacing:1px}
.center-label small{display:block;font-size:11px;color:#aaa;margin-top:6px}
.hover-label{display:none}
.lbl-overworld b{color:#55ff55}.lbl-home b{color:#ff5555}.lbl-ah b{color:#ffaa00}
.lbl-order b{color:#55ffff}.lbl-shop b{color:#ff55ff}.lbl-map b{color:#ffff55}

.pos-top-left:hover ~ .lbl-overworld,
.pos-top-right:hover ~ .lbl-home,
.pos-right:hover ~ .lbl-ah,
.pos-bottom-right:hover ~ .lbl-order,
.pos-bottom-left:hover ~ .lbl-shop,
.pos-left:hover ~ .lbl-map{display:block}

.pos-top-left:hover ~ .default-label,
.pos-top-right:hover ~ .default-label,
.pos-right:hover ~ .default-label,
.pos-bottom-right:hover ~ .default-label,
.pos-bottom-left:hover ~ .default-label,
.pos-left:hover ~ .default-label{display:none}
</style>
</head>
