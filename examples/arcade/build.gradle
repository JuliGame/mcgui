plugins {
    id 'java'
}

group = 'ai.resourcepack'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT'
    // A plugin of its own on the server, so never shaded.
    compileOnly 'ai.resourcepack:ui-engine:0.1.0'
    // ArcadeBench and the tests run the games with no server: the engine's canvas, and Bukkit's types on the classpath.
    testImplementation 'io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT'
    testImplementation 'ai.resourcepack:ui-engine:0.1.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// The classpath ArcadeBench runs on: java -cp "$(../../gradlew -q benchClasspath)" ai.resourcepack.arcade.ArcadeBench
tasks.register('benchClasspath') {
    dependsOn 'testClasses'
    doLast { println sourceSets.test.runtimeClasspath.asPath }
}

base { archivesName = 'Arcade' }

processResources {
    inputs.property('version', project.version)
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}
