name: Arcade
version: ${version}
main: ai.resourcepack.arcade.ArcadePlugin
api-version: '1.21'
depend: [UIEngine]
description: Arcade games, an example built on UI Engine. Play one fullscreen with your mouse, or put up a cabinet everyone can watch.
commands:
  arcade:
    description: Play an arcade game, or put up a cabinet.
    usage: /arcade play [game] [player] | cabinet [game] [cols] [rows] [x y z facing [world]] | remove [x y z [world]] | scores [game] | stats [trace]
permissions:
  # One node per subcommand, and arcade.admin, which also lets /arcade play seat somebody else.
  arcade.admin:
    description: Everything below, and /arcade play <game> <player>.
    default: op
    children:
      arcade.play: true
      arcade.cabinet: true
      arcade.remove: true
      arcade.scores: true
      arcade.stats: true
  arcade.play:
    description: Play a game of your own with /arcade play, or sit down at a cabinet by clicking it.
    default: true
  arcade.cabinet:
    description: Put up a cabinet on the wall you look at with /arcade cabinet.
    default: op
  arcade.remove:
    description: Take down the cabinet you look at with /arcade remove.
    default: op
  arcade.scores:
    description: See the high scores with /arcade scores.
    default: true
  arcade.stats:
    description: See how smoothly each running game runs with /arcade stats (trace writes every frame to trace.json).
    default: op
