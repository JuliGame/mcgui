plugins {
    id 'java'
    id 'java-library'
}

group = 'ai.resourcepack'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT'
    // The server ships netty; the map sender and the packet filters are netty handlers.
    compileOnly 'io.netty:netty-transport:4.2.7.Final'

    // Tests that drive the sender need the API's types (a wall, a player) on the classpath, as the server provides them.
    testImplementation 'io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

base { archivesName = 'UIFramework' }

test {
    useJUnitPlatform()
    testLogging { showStandardStreams = true }
}

processResources {
    inputs.property('version', project.version)
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

// Tests and a benchmark against a real Paper server's own classes (its netty pipeline handlers, packet
// codecs and compressor), for what reflection reaches on a running server. Only with a server directory
// that has run once (versions/ and libraries/), and a Java 25 toolchain, which Paper 26 is built for:
//   sh gradlew paperTest -PpaperServer=/path/to/server
//   sh gradlew paperBench -PpaperServer=/path/to/server
def paperServer = findProperty('paperServer')
if (paperServer != null) {
    sourceSets {
        paperTest {
            compileClasspath += sourceSets.main.output
            runtimeClasspath += sourceSets.main.output
        }
    }
    dependencies {
        paperTestImplementation fileTree("$paperServer/versions") { include '**/*.jar' }
        paperTestImplementation fileTree("$paperServer/libraries") { include '**/*.jar' }
        paperTestImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
        paperTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    def java25 = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    tasks.named('compilePaperTestJava') {
        javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
        options.release = 25
    }
    def paperJvmArgs = ['--enable-native-access=ALL-UNNAMED', '-Xmx2g']
    // The game's bootstrap writes logs/ where it runs: keep that in build/, not in the checkout.
    def paperDir = layout.buildDirectory.dir('paper').get().asFile
    tasks.register('paperTest', Test) {
        testClassesDirs = sourceSets.paperTest.output.classesDirs
        classpath = sourceSets.paperTest.runtimeClasspath
        javaLauncher = java25
        jvmArgs paperJvmArgs
        workingDir = paperDir
        doFirst { paperDir.mkdirs() }
        useJUnitPlatform()
        testLogging { showStandardStreams = true; events 'passed', 'failed'; exceptionFormat 'full' }
    }
    tasks.register('paperBench', JavaExec) {
        classpath = sourceSets.paperTest.runtimeClasspath
        mainClass = 'ai.resourcepack.uiframework.net.SharedCompressionBench'
        javaLauncher = java25
        jvmArgs paperJvmArgs + ['-Xlog:gc:file=gc.log']
        workingDir = paperDir
        doFirst { paperDir.mkdirs() }
        args((findProperty('benchArgs') ?: '').toString().tokenize())
    }
}
