plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'ai.resourcepack'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT'
    // A plugin of its own on the server (it owns the pack, the map ids and the seats), so never shaded.
    compileOnly 'ai.resourcepack:ui-framework:0.1.0'

    // HTML parsing, and SVG drawing for <svg> and .svg images. Shaded and relocated below.
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'com.github.weisj:jsvg:2.2.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    // The benchmark measures the canvas step too.
    testImplementation 'ai.resourcepack:ui-framework:0.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

shadowJar {
    archiveBaseName.set('UIEngine')
    archiveClassifier.set('')
    relocate 'org.jsoup', 'ai.resourcepack.ui.libs.jsoup'
    relocate 'com.github.weisj.jsvg', 'ai.resourcepack.ui.libs.jsvg'
}

jar {
    enabled = false
}

build {
    dependsOn shadowJar
}

test {
    useJUnitPlatform()
    maxHeapSize = '2g'
    systemProperty 'java.awt.headless', 'true'
    testLogging { showStandardStreams = true }
}

processResources {
    inputs.property('version', project.version)
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

// Renders every samples/*.html to build/samples/*.png: how the renderer is checked by eye.
tasks.register('renderSamples', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.resourcepack.ui.html.RenderSamples'
    // -Pdir=<folder> renders another folder (src/main/resources/pages, say); -Ponly=<name> one page.
    def dir = project.findProperty('dir') ?: 'samples'
    args = [file(dir).absolutePath, layout.buildDirectory.dir('samples').get().asFile.absolutePath] + (project.findProperty('only') ? [project.findProperty('only')] : [])
    systemProperty 'java.awt.headless', 'true'
}

// What each page costs a session: full render, canvas, hover repaint (RenderBench). -Pruns=<n>, -Ponly=<name>.
tasks.register('renderBench', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.resourcepack.ui.html.RenderBench'
    args = [file('samples').absolutePath, file('src/main/resources/pages').absolutePath]
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'runs', project.findProperty('runs') ?: '20'
    systemProperty 'only', project.findProperty('only') ?: ''
    maxHeapSize = '2g'
}

// Many players at once: N sessions sharing R render threads, input to frame latency, throughput, CPU, heap and the
// bytes a viewer would be sent (LoadBench). Knobs, all optional: -Ppages=menu,landing,shop -Psessions=1,2,4 -Prender=1,2,4
// -Pmodes=walk,flick,stress -Pbands=4 -Psecs=12 -Pwarm=2 -Psend=true -Pout=<csv> -Ptag=<label> -Pjvm=<extra jvm flags>.
tasks.register('loadBench', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.resourcepack.ui.html.LoadBench'
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'samples', file('samples').absolutePath
    systemProperty 'shipped', file('src/main/resources/pages').absolutePath
    ['pages', 'sessions', 'render', 'modes', 'bands', 'secs', 'warm', 'send', 'out', 'tag', 'nowarmcell', 'adaptive'].each { k ->
        if (project.hasProperty(k)) systemProperty k, project.property(k)
    }
    maxHeapSize = '3g'
    if (project.hasProperty('jvm')) jvmArgs project.property('jvm').split(' ')
}
