plugins {
    id 'java'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'ai.resourcepack'
version = '0.5.3'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    // spigot-api: the one API both servers have. Paper keeps Spigot's API, so compiling against it is what
    // makes one jar run on both, and what keeps a Paper-only call from creeping back in.
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    // ai.resourcepack:common, the small library our plugins share (the usage
    // count). Exclusive: the ai.resourcepack group is looked for here and
    // nowhere else, so a look-alike on Central cannot stand in for it.
    exclusiveContent {
        forRepository {
            maven { url = 'https://repo.resourcepack.ai' }
        }
        filter {
            includeGroup 'ai.resourcepack'
        }
    }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.21.8-R0.1-SNAPSHOT'
    // The server ships netty; the map sender and the packet filters are netty handlers.
    compileOnly 'io.netty:netty-transport:4.2.7.Final'

    // HTML parsing, and SVG drawing for <svg> and .svg images. Shaded and relocated below.
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'com.github.weisj:jsvg:2.2.0'
    // The anonymous usage count. Shaded and relocated below, so it never meets another plugin's copy.
    implementation 'ai.resourcepack:common:0.6.0'
    // Adventure, for building chat. Spigot has none and Paper's must never meet ours, so it is shaded and
    // relocated below; messages leave as BungeeCord chat, which both servers ship (platform/Platform). Gson
    // is the server's on both.
    implementation('net.kyori:adventure-api:4.24.0') { exclude group: 'org.jetbrains' }
    implementation('net.kyori:adventure-text-serializer-gson:4.24.0') {
        exclude group: 'com.google.code.gson'
        exclude group: 'org.jetbrains'
    }
    implementation('net.kyori:adventure-text-minimessage:4.24.0') { exclude group: 'org.jetbrains' }
    implementation('net.kyori:adventure-text-serializer-plain:4.24.0') { exclude group: 'org.jetbrains' }
    implementation('net.kyori:adventure-text-serializer-legacy:4.24.0') { exclude group: 'org.jetbrains' }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    // Tests that drive the map sender need the API's types (a wall, a player) on the classpath, as the server provides them.
    testImplementation 'org.spigotmc:spigot-api:1.21.8-R0.1-SNAPSHOT'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

shadowJar {
    archiveClassifier.set('')
    relocate 'org.jsoup', 'ai.resourcepack.ui.libs.jsoup'
    relocate 'com.github.weisj.jsvg', 'ai.resourcepack.ui.libs.jsvg'
    relocate 'ai.resourcepack.common', 'ai.resourcepack.ui.libs.common'
    relocate 'net.kyori', 'ai.resourcepack.ui.libs.kyori'
}

base { archivesName = 'MCGUI' }

// The classes alone, without the libraries: what the examples here (and anything else built in the same
// Gradle run) compile against. The plugin is the shadow jar, MCGUI-<version>.jar.
jar {
    archiveClassifier.set('dev')
}

build {
    dependsOn shadowJar
}

// For plugins that build against MC GUI: the plugin jar itself, with its sources. JitPack builds it
// from a tag of this repository (see the README).
publishing {
    publications {
        plugin(MavenPublication) {
            artifactId = 'mcgui'
            from components.shadow
            artifact sourcesJar
        }
    }
}

test {
    useJUnitPlatform()
    maxHeapSize = '2g'
    systemProperty 'java.awt.headless', 'true'
    testLogging { showStandardStreams = true }
}

processResources {
    inputs.property('version', project.version)
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

// Renders every samples/*.html to build/samples/*.png: how the renderer is checked by eye.
tasks.register('renderSamples', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.resourcepack.ui.html.RenderSamples'
    // -Pdir=<folder> renders another folder (src/main/resources/pages, say); -Ponly=<name> one page.
    def dir = project.findProperty('dir') ?: 'samples'
    args = [file(dir).absolutePath, layout.buildDirectory.dir('samples').get().asFile.absolutePath] + (project.findProperty('only') ? [project.findProperty('only')] : [])
    systemProperty 'java.awt.headless', 'true'
}

// What each page costs a session: full render, canvas, hover repaint (RenderBench). -Pruns=<n>, -Ponly=<name>.
// -Pscroll=1: what a notch of the wheel costs, drawn whole and cut from a ScrollCache (-Pnotches=<n>, -Pviews=<n>), with long test pages too.
tasks.register('renderBench', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.resourcepack.ui.html.RenderBench'
    def scroll = project.findProperty('scroll') ?: '0'
    args = [file('samples').absolutePath, file('src/main/resources/pages').absolutePath] + (scroll != '0' ? [file('src/test/resources/scroll').absolutePath] : [])
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'runs', project.findProperty('runs') ?: '20'
    systemProperty 'only', project.findProperty('only') ?: ''
    systemProperty 'scroll', scroll
    systemProperty 'notches', project.findProperty('notches') ?: '12'
    systemProperty 'views', project.findProperty('views') ?: '4'
    maxHeapSize = '2g'
}

// What styling costs per page, cold and on a hover, and a digest of every computed style to compare two builds (StyleBench).
// -Pdir=<folder or .html> (default samples), -Pruns=<n>, -Ponly=<substring>, -Pout=<tsv>, -Pdump=<dir>, -Ppng=<dir>.
tasks.register('styleBench', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.resourcepack.ui.html.StyleBench'
    args = [file(project.findProperty('dir') ?: 'samples').absolutePath]
    systemProperty 'java.awt.headless', 'true'
    ['runs', 'only', 'out', 'dump', 'png'].each { if (project.findProperty(it)) systemProperty it, project.findProperty(it) }
    maxHeapSize = '2g'
}

// Hostile pages, each on its own thread with a timeout, in child JVMs replaced after a timeout or OOM (Torture).
// -Psrc=cases (generated pathological pages, the default), a folder, or fuzz:<count>:<seed>; several separated by ','.
// -Ptimeout=<s> -Pheap=<size> -Ponly=<substring> -Pout=<tsv>.
tasks.register('torture', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.resourcepack.ui.html.Torture'
    args = (project.findProperty('src') ?: 'cases').toString().split(',').toList()
    systemProperty 'java.awt.headless', 'true'
    ['timeout', 'heap', 'only', 'out'].each { if (project.findProperty(it)) systemProperty it, project.findProperty(it) }
    maxHeapSize = '1g'
}

// Many players at once: N sessions sharing R render threads, input to frame latency, throughput, CPU, heap and the
// bytes a viewer would be sent (LoadBench). Knobs, all optional: -Ppages=menu,landing,shop -Psessions=1,2,4 -Prender=1,2,4
// -Pmodes=walk,flick,stress,hand -Pbands=4 -Psecs=12 -Pwarm=2 -Psend=true -Pout=<csv> -Ptag=<label> -Pjvm=<extra jvm flags>
// -Pahead=0,3 (hover targets drawn ahead, interleaved cell by cell) -Preps=<n> -Pverify=true (each hover drawn ahead checked against the repaint).
tasks.register('loadBench', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.resourcepack.ui.html.LoadBench'
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'samples', file('samples').absolutePath
    systemProperty 'shipped', file('src/main/resources/pages').absolutePath
    ['pages', 'sessions', 'render', 'modes', 'bands', 'secs', 'warm', 'send', 'out', 'tag', 'nowarmcell', 'adaptive', 'ahead', 'reps', 'verify', 'aheadevery'].each { k ->
        if (project.hasProperty(k)) systemProperty k, project.property(k)
    }
    maxHeapSize = '3g'
    if (project.hasProperty('jvm')) jvmArgs project.property('jvm').split(' ')
}

// Bytes allocated per whole picture, hover repaint and notch of the wheel, on every thread (AllocBench).
// -Ppages=<file,file> (default the shipped menu and shop, the landing sample and the long test page), -Pruns=<n>, -Pops=full,hover,notch, -Pjvm=<flags>.
tasks.register('allocBench', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.resourcepack.ui.html.AllocBench'
    args = (project.findProperty('pages') ?: 'src/main/resources/pages/menu.html,samples/landing.html,src/main/resources/pages/shop.html,src/test/resources/scroll/long.html')
            .toString().split(',').findAll { it }.collect { file(it).absolutePath }
    systemProperty 'java.awt.headless', 'true'
    ['runs', 'ops'].each { if (project.hasProperty(it)) systemProperty it, project.property(it) }
    maxHeapSize = '2g'
    if (project.hasProperty('jvm')) jvmArgs project.property('jvm').split(' ')
}

// What a notch of the wheel costs in bytes, packets and CPU, with the canvas moved by whole map rows and drawn whole (TileBench).
// -Pruns=<n>, -Pnotches=<n>, -Ppage=<file> (default the long test page).
tasks.register('tileBench', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.resourcepack.ui.html.TileBench'
    args = [file(project.findProperty('page') ?: 'src/test/resources/scroll/long.html').absolutePath]
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'runs', project.findProperty('runs') ?: '5'
    systemProperty 'notches', project.findProperty('notches') ?: '12'
    maxHeapSize = '2g'
}

// CPU per new session of a page with and without a kept first picture, the style and layout share of a first
// render, a viewer's own text repainted over another's picture, and the map packets a new viewer is sent
// (FirstPictureBench). -Pruns=<n>; -Ppages=<file,file> (default the shipped pages and the long test page).
tasks.register('firstPictureBench', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.resourcepack.ui.FirstPictureBench'
    args = (project.findProperty('pages') ?: '').toString().split(',').findAll { it }.collect { file(it).absolutePath }
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'runs', project.findProperty('runs') ?: '20'
    maxHeapSize = '2g'
}

// What a new viewer costs the server thread (CPU and allocation, taking a kept first picture or drawing it) and the live
// heap each watching session holds, with real Sessions and no server (SessionBench). -Ppages=shop,rules -Psizes=4x3,16x9
// -Popens=<n> -Psessions=1,16,64 -Pmode=open|heap|both.
tasks.register('sessionBench', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.resourcepack.ui.SessionBench'
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'shipped', file('src/main/resources/pages').absolutePath
    ['pages', 'sizes', 'opens', 'warm', 'sessions', 'mode'].each { k ->
        if (project.hasProperty(k)) systemProperty k, project.property(k)
    }
    maxHeapSize = '3g'
}

// What one hover costs on one thread: the repaint, which preparing hovers in advance takes away, and Canvas.draw,
// which is left (HoverCost). -Pruns=<n>, -Ppages=<spec,spec> (default the shipped menu and shop and every sample).
tasks.register('hoverCost', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.resourcepack.ui.html.HoverCost'
    args = (project.findProperty('pages') ?: '').toString().split(',').findAll { it }
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'samples', file('samples').absolutePath
    systemProperty 'shipped', file('src/main/resources/pages').absolutePath
    systemProperty 'runs', project.findProperty('runs') ?: '5'
    maxHeapSize = '2g'
}

// What hover layers cost and save the server per target of a page, layers off against on (LayerBench).
// -Pdir=<pages folder> (default the shipped one), -Ppages=market,quests, -Players=<maps a view gets>, -Ptargets=<most per page>,
// -Pgeom=1 (print each layer's place and maps), -Pwhy=1 (why a target got no layer).
tasks.register('layerBench', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.resourcepack.ui.LayerBench'
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'dir', project.findProperty('dir') ?: file('src/main/resources/pages').absolutePath
    ['pages', 'layers', 'targets', 'geom', 'why'].each { k ->
        if (project.hasProperty(k)) systemProperty k, project.property(k)
    }
    maxHeapSize = '3g'
}

// The test runtime classpath, for bench/bench.py: it builds under one lock and runs the benches under another.
tasks.register('benchClasspath') {
    dependsOn 'testClasses'
    doLast { println sourceSets.test.runtimeClasspath.asPath }
}

// What a page that moves costs at 1, 10 and 50 viewers ticked as on a server: CPU per animated second, pictures each
// viewer gets a second against animation-fps, and compressed bytes a second (AnimBench). -Pdir=<pages folder>
// -Ppages=name[:hover:selector],... -Psessions=1,10,50 -Psize=16x9 -Pheight=576 -Psecs=10 -Pwarm=3 -Pfps=10 -Pthreads=<n> -Pout=<tsv> -Ptag=<label>.
tasks.register('animBench', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.resourcepack.ui.AnimBench'
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'dir', file(project.findProperty('dir') ?: 'src/main/resources/pages').absolutePath
    ['pages', 'sessions', 'size', 'height', 'secs', 'warm', 'fps', 'threads', 'out', 'tag'].each { k ->
        if (project.hasProperty(k)) systemProperty k, project.property(k)
    }
    maxHeapSize = '3g'
}

// Tests and a benchmark against a real Paper server's own classes (its netty pipeline handlers, packet
// codecs and compressor), for what reflection reaches on a running server. Only with a server directory
// that has run once (versions/ and libraries/), and a Java 25 toolchain, which Paper 26 is built for:
//   sh gradlew paperTest -PpaperServer=/path/to/server
//   sh gradlew paperBench -PpaperServer=/path/to/server
def paperServer = findProperty('paperServer')
if (paperServer != null) {
    sourceSets {
        paperTest {
            compileClasspath += sourceSets.main.output
            runtimeClasspath += sourceSets.main.output
        }
    }
    dependencies {
        paperTestImplementation fileTree("$paperServer/versions") { include '**/*.jar' }
        paperTestImplementation fileTree("$paperServer/libraries") { include '**/*.jar' }
        paperTestImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
        paperTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    def java25 = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    tasks.named('compilePaperTestJava') {
        javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
        options.release = 25
    }
    def paperJvmArgs = ['--enable-native-access=ALL-UNNAMED', '-Xmx2g']
    // The game's bootstrap writes logs/ where it runs: keep that in build/, not in the checkout.
    def paperDir = layout.buildDirectory.dir('paper').get().asFile
    tasks.register('paperTest', Test) {
        testClassesDirs = sourceSets.paperTest.output.classesDirs
        classpath = sourceSets.paperTest.runtimeClasspath
        javaLauncher = java25
        jvmArgs paperJvmArgs
        workingDir = paperDir
        doFirst { paperDir.mkdirs() }
        useJUnitPlatform()
        testLogging { showStandardStreams = true; events 'passed', 'failed'; exceptionFormat 'full' }
    }
    tasks.register('paperBench', JavaExec) {
        classpath = sourceSets.paperTest.runtimeClasspath
        mainClass = 'ai.resourcepack.ui.framework.net.SharedCompressionBench'
        javaLauncher = java25
        jvmArgs paperJvmArgs + ['-Xlog:gc:file=gc.log']
        workingDir = paperDir
        doFirst { paperDir.mkdirs() }
        args((findProperty('benchArgs') ?: '').toString().tokenize())
    }
}
