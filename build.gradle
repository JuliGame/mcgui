plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'ai.resourcepack'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT'
    // A plugin of its own on the server (it owns the pack, the map ids and the seats), so never shaded.
    compileOnly 'ai.resourcepack:ui-framework:0.1.0'

    // HTML parsing, and SVG drawing for <svg> and .svg images. Shaded and relocated below.
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'com.github.weisj:jsvg:2.2.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    // The benchmark measures the canvas step too.
    testImplementation 'ai.resourcepack:ui-framework:0.1.0'
    // TileScrollTest drives the framework's map sender, whose assignments name a Bukkit player and wall.
    testImplementation 'io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

shadowJar {
    archiveBaseName.set('UIEngine')
    archiveClassifier.set('')
    relocate 'org.jsoup', 'ai.resourcepack.ui.libs.jsoup'
    relocate 'com.github.weisj.jsvg', 'ai.resourcepack.ui.libs.jsvg'
}

jar {
    enabled = false
}

build {
    dependsOn shadowJar
}

test {
    useJUnitPlatform()
    maxHeapSize = '2g'
    systemProperty 'java.awt.headless', 'true'
    testLogging { showStandardStreams = true }
}

processResources {
    inputs.property('version', project.version)
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

// Renders every samples/*.html to build/samples/*.png: how the renderer is checked by eye.
tasks.register('renderSamples', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.resourcepack.ui.html.RenderSamples'
    // -Pdir=<folder> renders another folder (src/main/resources/pages, say); -Ponly=<name> one page.
    def dir = project.findProperty('dir') ?: 'samples'
    args = [file(dir).absolutePath, layout.buildDirectory.dir('samples').get().asFile.absolutePath] + (project.findProperty('only') ? [project.findProperty('only')] : [])
    systemProperty 'java.awt.headless', 'true'
}

// What each page costs a session: full render, canvas, hover repaint (RenderBench). -Pruns=<n>, -Ponly=<name>.
// -Pscroll=1: what a notch of the wheel costs, drawn whole and cut from a ScrollCache (-Pnotches=<n>, -Pviews=<n>), with long test pages too.
tasks.register('renderBench', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.resourcepack.ui.html.RenderBench'
    def scroll = project.findProperty('scroll') ?: '0'
    args = [file('samples').absolutePath, file('src/main/resources/pages').absolutePath] + (scroll != '0' ? [file('src/test/resources/scroll').absolutePath] : [])
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'runs', project.findProperty('runs') ?: '20'
    systemProperty 'only', project.findProperty('only') ?: ''
    systemProperty 'scroll', scroll
    systemProperty 'notches', project.findProperty('notches') ?: '12'
    systemProperty 'views', project.findProperty('views') ?: '4'
    maxHeapSize = '2g'
}

// What styling costs per page, cold and on a hover, and a digest of every computed style to compare two builds (StyleBench).
// -Pdir=<folder or .html> (default samples), -Pruns=<n>, -Ponly=<substring>, -Pout=<tsv>, -Pdump=<dir>, -Ppng=<dir>.
tasks.register('styleBench', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.resourcepack.ui.html.StyleBench'
    args = [file(project.findProperty('dir') ?: 'samples').absolutePath]
    systemProperty 'java.awt.headless', 'true'
    ['runs', 'only', 'out', 'dump', 'png'].each { if (project.findProperty(it)) systemProperty it, project.findProperty(it) }
    maxHeapSize = '2g'
}

// Hostile pages, each on its own thread with a timeout, in child JVMs replaced after a timeout or OOM (Torture).
// -Psrc=cases (generated pathological pages, the default), a folder, or fuzz:<count>:<seed>; several separated by ','.
// -Ptimeout=<s> -Pheap=<size> -Ponly=<substring> -Pout=<tsv>.
tasks.register('torture', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.resourcepack.ui.html.Torture'
    args = (project.findProperty('src') ?: 'cases').toString().split(',').toList()
    systemProperty 'java.awt.headless', 'true'
    ['timeout', 'heap', 'only', 'out'].each { if (project.findProperty(it)) systemProperty it, project.findProperty(it) }
    maxHeapSize = '1g'
}

// Many players at once: N sessions sharing R render threads, input to frame latency, throughput, CPU, heap and the
// bytes a viewer would be sent (LoadBench). Knobs, all optional: -Ppages=menu,landing,shop -Psessions=1,2,4 -Prender=1,2,4
// -Pmodes=walk,flick,stress,hand -Pbands=4 -Psecs=12 -Pwarm=2 -Psend=true -Pout=<csv> -Ptag=<label> -Pjvm=<extra jvm flags>
// -Pahead=0,3 (hover targets drawn ahead, interleaved cell by cell) -Preps=<n> -Pverify=true (each hover drawn ahead checked against the repaint).
tasks.register('loadBench', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.resourcepack.ui.html.LoadBench'
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'samples', file('samples').absolutePath
    systemProperty 'shipped', file('src/main/resources/pages').absolutePath
    ['pages', 'sessions', 'render', 'modes', 'bands', 'secs', 'warm', 'send', 'out', 'tag', 'nowarmcell', 'adaptive', 'ahead', 'reps', 'verify'].each { k ->
        if (project.hasProperty(k)) systemProperty k, project.property(k)
    }
    maxHeapSize = '3g'
    if (project.hasProperty('jvm')) jvmArgs project.property('jvm').split(' ')
}

// What a notch of the wheel costs in bytes, packets and CPU, with the canvas moved by whole map rows and drawn whole (TileBench).
// -Pruns=<n>, -Pnotches=<n>, -Ppage=<file> (default the long test page).
tasks.register('tileBench', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.resourcepack.ui.html.TileBench'
    args = [file(project.findProperty('page') ?: 'src/test/resources/scroll/long.html').absolutePath]
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'runs', project.findProperty('runs') ?: '5'
    systemProperty 'notches', project.findProperty('notches') ?: '12'
    maxHeapSize = '2g'
}

// CPU per new session of a page with and without a kept first picture, the style and layout share of a first
// render, a viewer's own text repainted over another's picture, and the map packets a new viewer is sent
// (FirstPictureBench). -Pruns=<n>; -Ppages=<file,file> (default the shipped pages and the long test page).
tasks.register('firstPictureBench', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.resourcepack.ui.FirstPictureBench'
    args = (project.findProperty('pages') ?: '').toString().split(',').findAll { it }.collect { file(it).absolutePath }
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'runs', project.findProperty('runs') ?: '20'
    maxHeapSize = '2g'
}

// What one hover costs on one thread: the repaint, which preparing hovers in advance takes away, and Canvas.draw,
// which is left (HoverCost). -Pruns=<n>, -Ppages=<spec,spec> (default the shipped menu and shop and every sample).
tasks.register('hoverCost', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.resourcepack.ui.html.HoverCost'
    args = (project.findProperty('pages') ?: '').toString().split(',').findAll { it }
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'samples', file('samples').absolutePath
    systemProperty 'shipped', file('src/main/resources/pages').absolutePath
    systemProperty 'runs', project.findProperty('runs') ?: '5'
    maxHeapSize = '2g'
}
